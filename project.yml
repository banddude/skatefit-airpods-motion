name: SkateMotion
options:
  bundleIdPrefix: com.banddude.skatefit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6D4T7VB2AF
    CODE_SIGN_STYLE: Automatic
targets:
  SkateMotion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkateMotion
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: SkateMotion/Info.plist
      properties:
        CFBundleDisplayName: SkateFit Motion Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "18"
        NSMotionUsageDescription: "SkateFit records board-mounted AirPod orientation and motion to coach manual balance and research skateboard movement."
        NSLocationWhenInUseUsageDescription: "Optional outdoor speed from this iPhone while practicing. GPS coordinates are not saved or uploaded."
        NSLocalNetworkUsageDescription: "Connect this iPhone to your Apple TV to share board motion on your local network. No camera or internet server is used."
        NSBonjourServices:
          - _skatefit._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  SkateMotionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SkateMotionTests
      - path: SharedTests
    dependencies:
      - target: SkateMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tests
  SkateMotionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SkateMotionUITests
    dependencies:
      - target: SkateMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.uitests

  SkateMotionTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: SkateMotionTV
        excludes:
          - Info.plist
      - path: Shared
      - path: SkateMotion/Models/BoardMathTypes.swift
      - path: SkateMotion/Models/BoardOrientation.swift
      - path: SkateMotion/Models/RunnerCourse.swift
      - path: SkateMotion/Models/RunnerEngine.swift
      - path: SkateMotion/Models/RunnerInput.swift
      - path: SkateMotion/Models/RunnerProgressStore.swift
      - path: SkateMotion/Views/Board3DView.swift
      - path: SkateMotion/Views/RunnerSceneView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tv
        ASSETCATALOG_COMPILER_APPICON_NAME: TVBrand
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SkateMotionTV/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  SkateMotionTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TVBridgeTests
      - path: SharedTests
    dependencies:
      - target: SkateMotionTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tv.tests

  SkateMotionTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: SkateMotionTVUITests
    dependencies:
      - target: SkateMotionTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tv.uitests

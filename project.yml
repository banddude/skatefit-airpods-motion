name: SkateMotion
options:
  bundleIdPrefix: com.banddude.skatefit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  SkateMotion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkateMotion
        excludes:
          - Info.plist
    info:
      path: SkateMotion/Info.plist
      properties:
        CFBundleDisplayName: SkateFit Motion Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMotionUsageDescription: "SkateFit Motion Lab records iPhone and AirPods motion to research skateboard tricks, manuals, and landings."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  SkateMotionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SkateMotionTests
    dependencies:
      - target: SkateMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tests

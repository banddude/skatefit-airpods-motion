name: SkateMotion
options:
  bundleIdPrefix: com.banddude.skatefit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6D4T7VB2AF
    CODE_SIGN_STYLE: Automatic
targets:
  SkateMotion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkateMotion
        excludes:
          - Info.plist
    info:
      path: SkateMotion/Info.plist
      properties:
        CFBundleDisplayName: SkateFit Motion Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "12"
        NSMotionUsageDescription: "SkateFit Motion Lab records iPhone and AirPods motion to research skateboard tricks, manuals, and landings."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  SkateMotionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SkateMotionTests
    dependencies:
      - target: SkateMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.tests
  SkateMotionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SkateMotionUITests
    dependencies:
      - target: SkateMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banddude.skatefit.motionlab.uitests
